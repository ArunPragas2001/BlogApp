<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlogSphere</title>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <!-- Font Awesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo link to homepage -->
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-layer-group logo-icon"></i>
                <span>BlogSphere</span>
            </a>

            <h2>Create Your Account</h2>
            <p class="subtitle">Join BlogSphere and start sharing your ideas</p>

            <form>
                <div class="input-group">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" placeholder="Email Address" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" placeholder="Create Password" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-shield-halved input-icon"></i>
                    <input type="password" placeholder="Confirm Password" required>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" required> I agree to the <a href="#" class="terms-link">Terms & Privacy</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>

</html>
