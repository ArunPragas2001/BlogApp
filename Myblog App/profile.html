<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - BlogSphere</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/profile.css">
</head>

<body>
    <header class="global-header">
        <a href="index.html" class="logo">
            <div class="logo-badge"><i class="fa-solid fa-feather-pointed"></i></div>
            <span class="logo-text">Blog<span class="logo-highlight">Sphere</span></span>
        </a>

        <nav class="global-nav-links">
            <a href="index.html" class="nav-link-btn">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="dashboard.html" class="nav-link-btn">
                <i class="fa-solid fa-chart-line"></i> Dashboard
            </a>
            <a href="createBlog.html" class="nav-link-btn">
                <i class="fa-solid fa-plus"></i> Write Blog
            </a>
            <a href="profile.html" class="nav-link-btn" style="background: #EEF2FF; color: #4F46E5;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" id="headerNavAvatar" class="nav-user-avatar" alt="Avatar">
                <span id="headerNavName">Profile</span>
            </a>
        </nav>
    </header>

    <div class="profile-container">
        <aside class="profile-card-sidebar">
            <div class="avatar-wrapper">
                <label for="profileImageUpload" style="cursor: pointer; display: block; position: relative; width: 100%; height: 100%;" title="Click to change profile picture">
                    <img id="sidebarAvatarPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Profile Picture" class="profile-avatar" onerror="this.src='https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'">
                    <div class="camera-overlay">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </label>
                <input type="file" id="profileImageUpload" style="display:none;" accept="image/*">
            </div>
            <h2 id="sidebarName">Loading...</h2>
            <p class="user-email" id="sidebarEmail">user@example.com</p>
            <div class="user-bio-badge" id="sidebarBio">
                Blogger & Content Creator
            </div>
            <small style="color: #94A3B8; display: block;">Member of BlogSphere Community</small>
        </aside>

        <main class="profile-form-card">
            <h3>Account Settings</h3>
            <p class="subtitle">Update your personal information and profile picture</p>

            <form id="profileForm" novalidate>
                <div class="form-group">
                    <label for="profileName"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="profileName" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="profileEmail"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="profileEmail" placeholder="Your email address" required>
                </div>

                <div class="form-group">
                    <label for="profilePic"><i class="fa-solid fa-camera"></i> Profile Picture</label>
                    <div style="display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;">
                        <label for="profileImageUpload" style="background:#4F46E5; color:#fff; padding:8px 16px; border-radius:8px; font-size:0.85rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Upload New Photo
                        </label>
                        <span style="font-size:0.82rem; color:#64748B;">or paste Image URL below:</span>
                    </div>
                    <input type="url" id="profilePic" placeholder="https://example.com/avatar.jpg">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="font-size: 0.85rem; font-weight: 600; color: #475569; display: block; margin-bottom: 8px;">Or Pick a Sample Avatar:</label>
                    <div style="display: flex; gap: 10px;" id="sampleAvatars">
                        <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" style="width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 2px solid #E2E8F0;" onclick="selectSampleAvatar(this.src)">
                        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" style="width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 2px solid #E2E8F0;" onclick="selectSampleAvatar(this.src)">
                        <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?auto=format&fit=crop&w=150&q=80" style="width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 2px solid #E2E8F0;" onclick="selectSampleAvatar(this.src)">
                        <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=150&q=80" style="width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 2px solid #E2E8F0;" onclick="selectSampleAvatar(this.src)">
                    </div>
                </div>

                <div class="form-group">
                    <label for="profileBio"><i class="fa-regular fa-comment-dots"></i> Bio / About You</label>
                    <textarea id="profileBio" rows="3" placeholder="Tell the community a little about yourself..."></textarea>
                </div>

                <div class="form-group">
                    <label for="profileOldPassword"><i class="fa-solid fa-lock"></i> Current Password (required to change password)</label>
                    <div style="position:relative;">
                        <input type="password" id="profileOldPassword" placeholder="Enter your current password" autocomplete="current-password">
                        <button type="button" onclick="togglePwVisibility('profileOldPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748B;font-size:1rem;"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="profilePassword"><i class="fa-solid fa-key"></i> New Password <span style="font-weight:400;color:#94A3B8;">(leave blank to keep unchanged)</span></label>
                    <div style="position:relative;">
                        <input type="password" id="profilePassword" placeholder="Enter new password (min. 6 chars)" autocomplete="new-password">
                        <button type="button" onclick="togglePwVisibility('profilePassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748B;font-size:1rem;"><i class="fa-regular fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-group" id="confirmPasswordGroup" style="display:none;">
                    <label for="profileConfirmPassword"><i class="fa-solid fa-key"></i> Confirm New Password</label>
                    <div style="position:relative;">
                        <input type="password" id="profileConfirmPassword" placeholder="Re-enter new password" autocomplete="new-password">
                        <button type="button" onclick="togglePwVisibility('profileConfirmPassword', this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#64748B;font-size:1rem;"><i class="fa-regular fa-eye"></i></button>
                    </div>
                    <small id="pwMatchError" style="color:#EF4444;display:none;margin-top:4px;"></small>
                </div>

                <button type="submit" class="btn-save-profile" id="saveProfileBtn">
                    <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
                </button>
            </form>
        </main>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/profile.js"></script>
</body>

</html>
