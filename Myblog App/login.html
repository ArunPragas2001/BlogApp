<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlogSphere</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/navigationHelpers.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap:wrap; gap:10px;">

                <a href="index.html" class="logo" style="margin-bottom: 0;">
                    <div class="logo-badge"><i class="fa-solid fa-feather-pointed"></i></div>
                    <span class="logo-text" style="color:#0F172A;">Blog<span class="logo-highlight">Sphere</span></span>
                </a>
                <a href="index.html"
                    style="text-decoration: none; color: #4F46E5; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <h2>Welcome back</h2>
            <p class="subtitle">Login to continue your journey</p>

            <form id="loginForm" novalidate>
                <div id="generalError" class="error-text general-error"></div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address">
                    </div>
                    <small class="error-text" id="emailError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Password">
                    </div>
                    <small class="error-text" id="passwordError"></small>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password" id="forgotPasswordBtn">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Login</button>

                <div class="auth-divider" style="display:flex; align-items:center; margin:20px 0; color:#94A3B8; font-size:0.85rem;">
                    <div style="flex:1; height:1px; background:#E2E8F0;" class="divider-line"></div>
                    <span style="padding:0 14px; font-weight:500;">or continue with</span>
                    <div style="flex:1; height:1px; background:#E2E8F0;" class="divider-line"></div>
                </div>

                <button type="button" id="googleSignInBtn" class="btn-google" style="width:100%; display:flex; align-items:center; justify-content:center; gap:12px; padding:12px; border-radius:12px; border:1.5px solid #E2E8F0; background:#FFFFFF; color:#0F172A; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.25s ease; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign in with Google</span>
                </button>
                <div id="googleHiddenBtn" style="display:none;"></div>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>

    <!-- Password Recovery Modal -->
    <div id="forgotPasswordModal"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.75); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
        <div class="auth-card"
            style="max-width:440px; width:100%; position:relative; box-shadow:0 25px 60px rgba(0,0,0,0.3); border-radius:24px; padding:32px;">
            <button type="button" id="closeForgotModalBtn"
                style="position:absolute; top:20px; right:20px; background:#F1F5F9; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; color:#64748B; font-size:1.1rem; display:flex; align-items:center; justify-content:center;">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Step 1: Request Code -->
            <div id="forgotStep1">
                <div
                    style="width:50px; height:50px; border-radius:14px; background:#EEF2FF; color:#4F46E5; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:16px;">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 style="font-size:1.5rem; margin-bottom:6px;">Reset Password</h2>
                <p class="subtitle" style="margin-bottom:20px;">Enter your registered email address to receive a 6-digit
                    recovery code.</p>

                <div id="forgotStep1Error" class="error-text general-error" style="display:none; margin-bottom:14px;">
                </div>

                <div class="input-field-wrapper" style="margin-bottom:20px;">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="forgotEmailInput" placeholder="Enter your registered email">
                    </div>
                </div>

                <button type="button" id="sendRecoveryCodeBtn" class="btn-submit" style="width:100%;">
                    <i class="fa-solid fa-paper-plane"></i> Send Verification Code
                </button>
            </div>

            <!-- Step 2: Enter Code and New Password -->
            <div id="forgotStep2" style="display:none;">
                <div
                    style="width:50px; height:50px; border-radius:14px; background:#ECFDF5; color:#10B981; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:16px;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 style="font-size:1.5rem; margin-bottom:6px;">Set New Password</h2>
                <p class="subtitle" style="margin-bottom:20px;">We sent a 6-digit code to <strong id="sentToEmailSpan"
                        style="color:#4F46E5;"></strong></p>

                <div id="forgotStep2Error" class="error-text general-error" style="display:none; margin-bottom:14px;">
                </div>

                <div class="input-field-wrapper" style="margin-bottom:14px;">
                    <div class="input-group">
                        <i class="fa-solid fa-hashtag input-icon"></i>
                        <input type="text" id="resetCodeInput" placeholder="6-digit Verification Code" maxlength="6"
                            style="letter-spacing:2px; font-weight:700;">
                    </div>
                </div>

                <div class="input-field-wrapper" style="margin-bottom:14px;">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="resetNewPasswordInput"
                            placeholder="Enter new password (min. 6 chars)">
                    </div>
                    <div id="resetStrengthMeter"></div>
                </div>

                <div class="input-field-wrapper" style="margin-bottom:20px;">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="resetConfirmPasswordInput" placeholder="Confirm new password">
                    </div>
                </div>

                <button type="button" id="submitResetPasswordBtn" class="btn-submit"
                    style="width:100%; margin-bottom:10px;">
                    <i class="fa-solid fa-check"></i> Reset & Update Password
                </button>

                <button type="button" id="backToStep1Btn"
                    style="background:none; border:none; color:#64748B; width:100%; cursor:pointer; font-size:0.88rem; padding:6px;">
                    <i class="fa-solid fa-arrow-left"></i> Change email address
                </button>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigationHelpers.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
