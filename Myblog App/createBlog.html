<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog | BlogSphere</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/createBlog.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-layer-group logo-icon"></i>
                <span>BlogSphere</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
                <li><a href="createBlog.html" class="active"><i class="fa-solid fa-plus"></i> Write Blog</a></li>
                <li><a href="profile.html"><i class="fa-regular fa-user"></i> Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="create-blog-page">
        <div class="create-blog-container">
            <div class="create-blog-header">
                <h1 id="pageHeading">Create a New Blog</h1>
                <p id="pageSubtitle">Share your ideas, knowledge and stories with the world.</p>
            </div>

            <form class="blog-form" id="createBlogForm" novalidate>
                <div id="generalError" class="error-text general-error"></div>

                <div class="form-group">
                    <label for="blog-title">Blog Title</label>
                    <input type="text" id="blog-title" name="blog-title" placeholder="Enter an engaging blog title">
                    <small class="error-text" id="titleError"></small>
                </div>

                <div class="form-group">
                    <label for="blog-category">Category</label>
                    <select id="blog-category" name="blog-category">
                        <option value="">Select a category</option>
                        <option value="Politics">Politics</option>
                        <option value="Technology">Technology</option>
                        <option value="Programming">Programming</option>
                        <option value="Education">Education</option>
                        <option value="Travel">Travel</option>
                        <option value="Business">Business</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Web Design">Web Design</option>
                    </select>
                    <small class="error-text" id="categoryError"></small>
                </div>

                <div class="form-group">
                    <label for="blog-status">Publication Status</label>
                    <select id="blog-status" name="blog-status">
                        <option value="Published">Published</option>
                        <option value="Draft">Draft</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="blog-image">Featured Image Upload</label>
                    <input type="file" id="blogImageUpload" accept="image/*">
                    <input type="hidden" id="blog-image">
                    <div id="imagePreviewContainer" style="margin-top: 12px; display: none;">
                        <span style="font-size: 0.85rem; font-weight: 600; color: #64748B; display: block; margin-bottom: 6px;">Live Image Preview:</span>
                        <img id="imagePreview" alt="Image Preview" style="max-height: 220px; width: 100%; object-fit: cover; border-radius: 12px; border: 2px solid #6366F1;">
                    </div>
                </div>

                <div class="form-group">
                    <label for="blog-content">Blog Content</label>
                    <textarea id="blog-content" name="blog-content" rows="10" placeholder="Write your story here..."></textarea>
                    <small class="error-text" id="contentError"></small>
                </div>

                <div class="form-actions">
                    <a href="dashboard.html" class="cancel-btn">Cancel</a>
                    <button type="submit" id="submitBtn" class="publish-btn">
                        <i class="fa-solid fa-paper-plane"></i> Publish Blog
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <p>© 2026 BlogSphere. All Rights Reserved.</p>
    </footer>
    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/createBlog.js"></script>
</body>

</html>
