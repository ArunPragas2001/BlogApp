<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlogSphere</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/navigationHelpers.css">
    <link rel="stylesheet" href="css/register.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap:wrap; gap:10px;">

                <a href="index.html" class="logo" style="margin-bottom: 0;">
                    <div class="logo-badge"><i class="fa-solid fa-feather-pointed"></i></div>
                    <span class="logo-text" style="color:#0F172A;">Blog<span class="logo-highlight">Sphere</span></span>
                </a>
                <a href="index.html"
                    style="text-decoration: none; color: #4F46E5; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <h2>Create Your Account</h2>
            <p class="subtitle">Join BlogSphere and start sharing your ideas</p>

            <form id="registerForm" novalidate>
                <div id="generalError" class="error-text general-error"></div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" placeholder="Full Name" id="registerName">
                    </div>
                    <small class="error-text" id="nameError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" placeholder="Email Address" id="registerEmail">
                    </div>
                    <small class="error-text" id="emailError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <select id="registerRole"
                            style="width: 100%; border: none; outline: none; background: transparent; font-family: inherit; font-size: 0.95rem; color: inherit; padding: 10px 0;">
                            <option value="user">Normal User (Blogger)</option>
                            <option value="admin">Administrator (Requires Owner Approval)</option>
                        </select>
                    </div>
                    <small id="roleNotice" style="color: #64748B; font-size: 0.78rem; display: none; margin-top: 4px;">
                        * Note: Admin accounts require verification and approval by the Owner.
                    </small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" placeholder="Create Password" id="registerPassword">
                    </div>

                    <small class="error-text" id="passwordError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" placeholder="Confirm Password" id="confirmPassword">
                    </div>
                    <small class="error-text" id="confirmPasswordError"></small>
                </div>

                <div class="form-options-wrapper">
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="terms"> I agree to the <a href="#" class="terms-link">Terms &
                                Privacy</a>
                        </label>
                    </div>
                    <small class="error-text" id="termsError"></small>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigationHelpers.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
