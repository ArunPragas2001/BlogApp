<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlogSphere</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/darkmode.css">
    <link rel="stylesheet" href="css/navigationHelpers.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap:wrap; gap:10px;">
                <button type="button" class="header-back-btn" onclick="goBackPreviousPage()" title="Go back to previous page">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <a href="index.html" class="logo" style="margin-bottom: 0;">
                    <div class="logo-badge"><i class="fa-solid fa-feather-pointed"></i></div>
                    <span class="logo-text" style="color:#0F172A;">Blog<span class="logo-highlight">Sphere</span></span>
                </a>
                <a href="index.html" style="text-decoration: none; color: #4F46E5; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; gap: 6px;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <h2>Welcome back</h2>
            <p class="subtitle">Login to continue your journey</p>

            <form id="loginForm" novalidate>
                <div id="generalError" class="error-text general-error"></div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address">
                    </div>
                    <small class="error-text" id="emailError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Password">
                    </div>
                    <small class="error-text" id="passwordError"></small>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password" id="forgotPasswordBtn">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>

    <!-- Password Recovery Modal -->
    <div id="forgotPasswordModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.75); backdrop-filter:blur(6px); z-index:9999; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
        <div class="auth-card" style="max-width:440px; width:100%; position:relative; box-shadow:0 25px 60px rgba(0,0,0,0.3); border-radius:24px; padding:32px;">
            <button type="button" id="closeForgotModalBtn" style="position:absolute; top:20px; right:20px; background:#F1F5F9; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; color:#64748B; font-size:1.1rem; display:flex; align-items:center; justify-content:center;">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- Step 1: Request Code -->
            <div id="forgotStep1">
                <div style="width:50px; height:50px; border-radius:14px; background:#EEF2FF; color:#4F46E5; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:16px;">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 style="font-size:1.5rem; margin-bottom:6px;">Reset Password</h2>
                <p class="subtitle" style="margin-bottom:20px;">Enter your registered email address to receive a 6-digit recovery code.</p>

                <div id="forgotStep1Error" class="error-text general-error" style="display:none; margin-bottom:14px;"></div>

                <div class="input-field-wrapper" style="margin-bottom:20px;">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="forgotEmailInput" placeholder="Enter your registered email">
                    </div>
                </div>

                <button type="button" id="sendRecoveryCodeBtn" class="btn-submit" style="width:100%;">
                    <i class="fa-solid fa-paper-plane"></i> Send Verification Code
                </button>
            </div>

            <!-- Step 2: Enter Code and New Password -->
            <div id="forgotStep2" style="display:none;">
                <div style="width:50px; height:50px; border-radius:14px; background:#ECFDF5; color:#10B981; display:flex; align-items:center; justify-content:center; font-size:1.4rem; margin-bottom:16px;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 style="font-size:1.5rem; margin-bottom:6px;">Set New Password</h2>
                <p class="subtitle" style="margin-bottom:20px;">We sent a 6-digit code to <strong id="sentToEmailSpan" style="color:#4F46E5;"></strong></p>

                <div id="forgotStep2Error" class="error-text general-error" style="display:none; margin-bottom:14px;"></div>

                <div class="input-field-wrapper" style="margin-bottom:14px;">
                    <div class="input-group">
                        <i class="fa-solid fa-hashtag input-icon"></i>
                        <input type="text" id="resetCodeInput" placeholder="6-digit Verification Code" maxlength="6" style="letter-spacing:2px; font-weight:700;">
                    </div>
                </div>

                <div class="input-field-wrapper" style="margin-bottom:14px;">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="resetNewPasswordInput" placeholder="Enter new password (min. 6 chars)">
                    </div>
                    <div id="resetStrengthMeter"></div>
                </div>

                <div class="input-field-wrapper" style="margin-bottom:20px;">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="resetConfirmPasswordInput" placeholder="Confirm new password">
                    </div>
                </div>

                <button type="button" id="submitResetPasswordBtn" class="btn-submit" style="width:100%; margin-bottom:10px;">
                    <i class="fa-solid fa-check"></i> Reset & Update Password
                </button>

                <button type="button" id="backToStep1Btn" style="background:none; border:none; color:#64748B; width:100%; cursor:pointer; font-size:0.88rem; padding:6px;">
                    <i class="fa-solid fa-arrow-left"></i> Change email address
                </button>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/navigationHelpers.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
