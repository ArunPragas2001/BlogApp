<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BlogSphere</title>
    <!-- Google Fonts -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <!-- Font Awesome Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo link to homepage -->
            <a href="index.html" class="auth-logo">
                <i class="fa-solid fa-layer-group logo-icon"></i>
                <span>BlogSphere</span>
            </a>

            <h2>Welcome back</h2>
            <p class="subtitle">Login to continue your journey</p>

            <form id="loginForm" novalidate>
                <div id="generalError" class="error-text general-error"></div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address">
                    </div>
                    <small class="error-text" id="emailError"></small>
                </div>

                <div class="input-field-wrapper">
                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Password">
                    </div>
                    <small class="error-text" id="passwordError"></small>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">Login</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="register.html">Register</a></p>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>

</html>
